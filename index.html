<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/POMPR_LOGO_WHT_HOR.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POMPR | V2.1</title>
    
    <style>
      /* Styles for the Legacy Error Screen */
      #legacy-gate {
        display: none;
        position: fixed;
        inset: 0;
        background-color: #0a0a0a;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        z-index: 9999;
      }
      #legacy-box {
        border: 1px solid #333;
        background-color: #111;
        border-radius: 8px;
        padding: 2.5rem 2rem;
        max-width: 450px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .blue-text { color: #3b82f6; font-weight: 900; letter-spacing: 1px; }
    </style>

    <script>
      /**
       * LEGACY SAFETY GATE (ES5 COMPATIBLE)
       * This script detects if the browser supports Optional Chaining (?.), 
       * which is the primary cause of white-screen crashes on iOS 12.
       */
      window.onload = function() {
        var isLegacy = false;
        try {
          // Attempt to evaluate a modern JS feature
          eval("var test = { a: 1 }; var b = test?.a;");
        } catch (e) {
          isLegacy = true;
        }

        if (isLegacy) {
          document.getElementById('legacy-gate').style.display = 'flex';
          var root = document.getElementById('root');
          if (root) root.style.display = 'none';
        }
      };
    </script>
  </head>
  <body style="margin: 0; background: #0a0a0a;">
    
    <!-- THE GATE: Hidden by default, shown only to old browsers -->
    <div id="legacy-gate">
      <div id="legacy-box">
        <h2 class="blue-text" style="font-size: 1.5rem; margin: 0 0 1rem 0;">POMPR | V2.1</h2>
        <p style="color: #a3a3a3; font-size: 1rem; lineHeight: 1.6; margin: 0;">
          Legacy Device Detected.<br><br>
          POMPR requires iOS 13+ or a modern desktop browser.
        </p>
      </div>
    </div>

    <!-- THE APP -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
